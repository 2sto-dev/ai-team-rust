[package]
name = "ai-team"
version = "0.1.0"
edition = "2024"
description = "Reusable Rust AI engineering team: Orchestrator + Architect + Builder + Reviewer"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["net", "io-util", "sync"] }
