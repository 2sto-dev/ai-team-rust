# MCP servers the company may use. Defined by the Owner; a contract only names them in
# `mcp_servers`. Paths in `args`/`cwd` are relative to this company folder.
#
#   command / args   how to start the server (stdio transport)
#   env              literal, non-secret variables
#   env_from         variables copied from the platform's environment (how secrets reach a server)
#   timeout_secs     per request (default 30)
#   offer_when       offer the tools only when the prompt contains one of these words (default: always)
servers:
  pydoc:
    description: Python standard-library documentation (local, read-only)
    command: python
    args: ["mcp/pydoc_server.py"]
    timeout_secs: 20
  rustdocs:
    description: Rust crate documentation, signatures and source (snowmead/rust-docs-mcp; caches crates, then offline)
    # Installed with: cargo install --locked --git https://github.com/snowmead/rust-docs-mcp rust-docs-mcp
    # Needs the nightly toolchain it pins: rustup toolchain install nightly-2026-05-22 --profile minimal --component rust-docs-json
    command: rust-docs-mcp
    args: ["serve"]
    env:
      RUST_DOCS_MCP_TOOLCHAIN: nightly-2026-05-22
    # Caching a crate downloads and documents it (rustdoc JSON); the first call can take minutes.
    timeout_secs: 300
    # Its 15 tool schemas cost ~6,200 tokens per call: offer them only for Rust work.
    offer_when: [rust, cargo, cargo.toml, crate, crates, rustc]
